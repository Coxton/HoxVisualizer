<section
    id="now-playing"
    class="now-playing"
    aria-label="Now playing"
>
    <div class="now-playing__artwork">
        <div class="now-playing__artwork-placeholder">
            <span aria-hidden="true">♫</span>
        </div>
    </div>

    <div class="now-playing__information">
        <span class="now-playing__label">
            NOW PLAYING
        </span>

        <h2
            id="now-playing-title"
            class="now-playing__title"
        >
            Nothing playing
        </h2>

        <p
            id="now-playing-artist"
            class="now-playing__artist"
        >
            Waiting for Spotify
        </p>
    </div>

    <div
        id="now-playing-status"
        class="now-playing__status"
        aria-label="Playback status"
    >
        <span class="now-playing__status-indicator"></span>
        <span class="now-playing__status-label">Waiting</span>
    </div>
</section>
